
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OFFGRID</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eae7df;
            color: #171717;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 7%;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border: 1px solid #ddd;
        }

        .login-box h1 {
            font-size: 30px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background: #333;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .register-link a {
            color: #111;
            font-weight: bold;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .flash {
            padding: 12px;
            margin-bottom: 20px;
            background: #f5e5e5;
            color: #8b2525;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="{{ url_for('home') }}" class="logo">OFFGRID®</a>
    </header>

    <main>
        <div class="login-box">

            <h1>WELCOME BACK.</h1>
            <p class="subtitle">Log in to your OFFGRID account.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('customer_login') }}">

                <label for="email">EMAIL ADDRESS</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">PASSWORD</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">LOG IN</button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="{{ url_for('customer_register') }}">Create one</a>
            </p>

            <a href="{{ url_for('home') }}" class="back-link">
                ← Back to store
            </a>

        </div>
    </main>

</body>
</html>
